# nginx modsec main.conf
SecRuleEngine On
SecRequestBodyAccess On
Include coreruleset/crs-setup.conf
Include coreruleset/rules/REQUEST-901-INITIALIZATION.conf
Include coreruleset/rules/REQUEST-941-APPLICATION-ATTACK-XSS.conf
Include coreruleset/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf

# Custom rate limit rule for the login endpoint
SecRule REQUEST_URI "@streq /login" "id:1001,phase:1,deny,status:429,msg:Login rate limit exceeded,setvar:ip.login_attempts=+1,expirevar:ip.login_attempts=60,chain"
SecRule IP:login_attempts "@gt 10"
