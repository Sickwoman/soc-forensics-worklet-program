# Place in /etc/ssh/sshd_config.d/10-mfa.conf on the Ubuntu Server MFA host, Ubuntu 22.04 or newer
# sshd keeps the first value it reads for each keyword, and sshd_config.d is included at the top of
# sshd_config, so these settings win over the defaults further down in the main file
# Check with sudo sshd -t before restarting, and keep a second session open until a test login works

UsePAM yes

# KbdInteractiveAuthentication replaced ChallengeResponseAuthentication in OpenSSH 8.7
# On Ubuntu 20.04 use ChallengeResponseAuthentication yes instead
KbdInteractiveAuthentication yes

# Password and TOTP are both asked for inside keyboard-interactive, by the PAM stack in pam-sshd-mfa.conf
# Plain password auth is turned off so it cannot be used to skip the TOTP prompt
AuthenticationMethods keyboard-interactive
PasswordAuthentication no
# For admins with SSH keys, use this instead to require key plus password plus TOTP
# AuthenticationMethods publickey,keyboard-interactive

PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30

# RBAC enforcement from docs/rbac-mapping.md, guests are not listed so they cannot log in
# Add your own admin account to the admins group first, or SSH will lock you out, console login still works
AllowGroups admins soc-team users
