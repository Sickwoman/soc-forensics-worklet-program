# Add this line to /etc/pam.d/sshd directly below the line @include common-auth
# common-auth asks for the password first, then this module asks for the six digit verification code
# Without nullok, a user who has not run google-authenticator yet cannot log in at all, which is what the policy requires
# During a rollout, append nullok to let un-enrolled users in with password only, then remove it once everyone is enrolled
auth required pam_google_authenticator.so
